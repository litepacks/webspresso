name = "webspresso-app"
main = ".webspresso/worker/index.mjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".webspresso/worker/assets/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "webspresso"
migrations_dir = "migrations"

[vars]
NODE_ENV = "production"

# Native / Node-only deps — stub for Workers bundle (see stubs/empty.mjs)
[alias]
"bcrypt" = "./stubs/empty.mjs"
"better-sqlite3" = "./stubs/empty.mjs"
"sharp" = "./stubs/empty.mjs"
"mock-aws-s3" = "./stubs/empty.mjs"
"aws-sdk" = "./stubs/empty.mjs"
"nock" = "./stubs/empty.mjs"
"@mapbox/node-pre-gyp" = "./stubs/empty.mjs"
